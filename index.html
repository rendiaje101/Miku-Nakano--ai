<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nakano Miku - AI Voice & OSINT Suite</title>
<style>
:root {
  --p: #ec4899;
  --u: #be185d;
  --a: #1e2235;
  --bg: #0f1016;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: radial-gradient(circle at top right, #4c0519, var(--bg));
  color: #fff;
  height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0;
  overflow: hidden;
}

.bg-glow {
  position: fixed;
  inset: 0;
  background: radial-gradient(at 20% 20%, #ec489930, transparent 50%), radial-gradient(at 80% 80%, #8b5cf630, transparent 50%), #08080c;
  z-index: -1;
}

.container {
  width: 100%;
  max-width: 900px;
  height: 100dvh; /* Menggunakan dvh agar pas dengan viewport HP */
  background: rgba(22, 24, 38, 0.95);
  border: 1px solid rgba(255, 255, 255, 0.12);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  position: relative;
}

@media (min-width: 768px) {
  .container {
    height: 96vh;
    border-radius: 20px;
  }
}

/* HEADER */
.header {
  padding: 12px 16px;
  background: rgba(15, 16, 22, 0.95);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 20;
  flex-shrink: 0;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar-wrap {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--p);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.avatar-wrap.speaking .avatar {
  transform: scale(1.08);
  box-shadow: 0 0 20px var(--p);
}

.details h2 {
  font-size: 0.95rem;
  font-weight: 600;
  line-height: 1.2;
}

.details p {
  font-size: 0.72rem;
  color: #f9a8d4;
  margin-top: 2px;
}

.controls {
  display: flex;
  align-items: center;
}

.menu-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #fff;
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s ease;
}

.menu-btn:hover, .menu-btn:active {
  background: var(--p);
}

/* DROPDOWN MENU */
.menu-dropdown {
  position: absolute;
  top: 66px;
  right: 16px;
  width: 230px;
  background: rgba(15, 16, 22, 0.98);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 14px;
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  display: none;
  flex-direction: column;
  overflow: hidden;
  z-index: 100;
  animation: slideDown 0.25s ease;
}

.menu-dropdown.show {
  display: flex;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.menu-item {
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.2s ease;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.menu-item:last-child {
  border-bottom: none;
}

.menu-item:hover {
  background: rgba(236, 72, 153, 0.15);
}

.menu-item.danger {
  color: #fb7185;
}

.menu-item.danger:hover {
  background: rgba(251, 113, 133, 0.15);
}

.menu-item .icon {
  font-size: 1rem;
  width: 20px;
  text-align: center;
}

.menu-divider {
  height: 1px;
  background: rgba(255, 255, 255, 0.1);
  margin: 2px 0;
}

/* CHAT BOX */
.chat-box {
  flex: 1;
  min-height: 0; /* MENCEGAH MENDORONG INPUT KELUAR LAYAR */
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}

.msg {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 0.92rem;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  animation: fadeIn 0.3s ease;
}

.msg a {
  color: #38bdf8;
  text-decoration: underline;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.user {
  align-self: flex-end;
  background: var(--u);
  border-bottom-right-radius: 4px;
  margin-left: auto;
}

.ai {
  align-self: flex-start;
  background: var(--a);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-bottom-left-radius: 4px;
  margin-right: auto;
}

.act {
  font-style: italic;
  color: #f9a8d4;
  background: rgba(236, 72, 153, 0.15);
  padding: 2px 6px;
  border-radius: 6px;
}

/* INPUT AREA - FIXED BOTTOM */
.input-area {
  padding: 10px 12px;
  background: rgba(15, 16, 22, 0.98);
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  display: flex;
  gap: 8px;
  align-items: center;
  width: 100%;
  flex-shrink: 0; /* Memastikan input bar tidak mengecil/terpotong */
  z-index: 10;
}

input#userInput {
  flex: 1;
  min-width: 0;
  height: 44px;
  padding: 0 14px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 12px;
  color: #fff;
  outline: none;
  font-size: 0.9rem;
  transition: border-color 0.2s ease;
}

input#userInput:focus {
  border-color: var(--p);
}

.btn {
  height: 44px;
  padding: 0 14px;
  border-radius: 12px;
  border: none;
  color: #fff;
  font-weight: 600;
  font-size: 0.88rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  white-space: nowrap;
  transition: background 0.2s ease, transform 0.1s ease;
}

.btn:active {
  transform: scale(0.97);
}

.btn-send {
  background: var(--p);
}

.btn-send:hover {
  background: #db2777;
}

.btn-mic {
  width: 44px;
  padding: 0;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  flex-shrink: 0;
}

.btn-mic.on {
  background: #dc2626;
  border-color: #ef4444;
  box-shadow: 0 0 12px #dc2626;
}

/* TRACK 150 MODAL & STYLES */
.track-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
  margin-top: 12px;
  max-height: 300px;
  overflow-y: auto;
  padding-right: 4px;
}

.track-card {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  text-align: left;
}

.track-card b {
  font-size: 0.8rem;
  display: block;
}

.track-card small {
  font-size: 0.65rem;
  color: #9ca3af;
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 120px;
}

.track-card a {
  background: #fff;
  color: #000;
  padding: 4px 8px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 0.68rem;
  font-weight: 700;
  flex-shrink: 0;
}

/* TOAST & MODAL */
#toast {
  position: absolute;
  top: 75px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15, 16, 22, 0.95);
  color: #f9a8d4;
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 0.78rem;
  border: 1px solid var(--p);
  display: none;
  z-index: 100;
}

.modal-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(5px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
}

.modal-overlay.show {
  display: flex;
}

.modal {
  background: rgba(30, 32, 50, 0.98);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 16px;
  padding: 20px;
  width: 90%;
  max-width: 500px;
  text-align: center;
}

.modal h3 {
  font-size: 1rem;
  margin-bottom: 8px;
}

.modal p {
  font-size: 0.8rem;
  color: #9ca3af;
  margin-bottom: 12px;
}

.modal input {
  width: 100%;
  height: 40px;
  padding: 0 12px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px;
  color: #fff;
  font-size: 0.85rem;
  outline: none;
  margin-bottom: 12px;
}

.modal-btns {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.m-btn {
  flex: 1;
  height: 40px;
  border-radius: 10px;
  border: none;
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
}

.m-cancel {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}

.m-confirm {
  background: var(--p);
  color: #fff;
}

.m-confirm.danger-btn {
  background: #dc2626;
}
</style>
</head>

<div class="bg-glow"></div>
<div id="toast">Status</div>

<div class="container">
  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="avatar-wrap" id="avatarWrap">

        <div class="track-grid" id="trackGrid"></div>
      </div>

      <div class="modal-btns">
        <button class="m-btn m-cancel" onclick="closeModal()">Batal</button>
        <button class="m-btn m-confirm" id="modalConfirmBtn" onclick="executeModalAction()">Proses</button>
      </div>
    </div>
  </div>
</div>

/* MENU LOGIC */

/* TRACK IP ADDRESS FUNCTION */
async function trackIPAddress(ip) {
  try {
    const targetIp = ip ? ip.trim() : '';
    const url = `https://ipwho.is/${targetIp}`;
    const res = await fetch(url);
    const data = await res.json();

    if (!data.success) {
      return `❌ Gagal melacak IP: ${data.message || 'IP tidak valid'}`;
    }

    const gmapsUrl = `https://www.google.com/maps?q=${data.latitude},${data.longitude}`;

    return `🌐 Analisa IP Address\n\n` +
      `- IP Query: ${data.ip}\n` +
      `- Negara: ${data.country}\n` +
      `- Wilayah / Provinsi: ${data.region}\n` +
      `- Kota: ${data.city}\n` +
      `- Kode Pos: ${data.postal || '-'}\n` +
      `- ISP: ${data.connection ? data.connection.isp : '-'}\n` +
      `- Organisasi: ${data.connection ? data.connection.org : '-'}\n` +
      `- ASN: ${data.connection ? data.connection.asn : '-'}\n` +
      `- Timezone: ${data.timezone ? data.timezone.id : '-'}\n` +
      `- Koordinat: ${data.latitude}, ${data.longitude}\n` +
      `- Google Maps: <a href="${gmapsUrl}" target="_blank">Lihat di Google Maps 📍</a>`;

  } catch (e) {
    return '❌ Terjadi kesalahan jaringan saat melacak IP.';
  }
}

      const link = url.replaceAll('{u}', u);

  }
  else if(modalAction === 'lookup') {
    let numb = document.getElementById('modalInput').value.trim();
    if(!numb) return showToast('Nomor tidak boleh kosong!');
    
    addMessage('user', `Lookup nomor: ${numb}`);
    let result = trackPhoneNumber(numb);
    addMessage('ai', result);
    closeModal();
  } 
  else if(modalAction === 'track_ip') {
    let ip = document.getElementById('modalInput').value.trim();
    addMessage('user', `Tracking IP: ${ip || 'IP Sendiri'}`);
    closeModal();
    
    let loadingId = addMessage('ai', '<i>Sedang melacak IP address...</i>');

    document.getElementById(loadingId).innerHTML = result;
  }
  else if(modalAction === 'clear'){
    box.innerHTML='';
    showToast('🧹 Chat dihapus');
    closeModal();
  } 
  else if(modalAction === 'restart'){
    box.innerHTML='';
    let jam=new Date().getHours();
    let waktu = jam<11?"pagi":jam<15?"siang":jam<18?"sore":"malam";
    let sapaan = `(*melambaikan tangan pelan*)\n\nHaiii lagi sayang... selamat ${waktu}... (*senyum malu*)\n\nKita mulai dari awal lagi ya? Aku udah siap dengerin cerita kamu...`;
    box.innerHTML=`<div class="msg ai">${formatText(sapaan)}</div>`;
    speakAnime(sapaan);
    showToast('🔄 Chat dimulai ulang');
    closeModal();
  }
}

/* VOICE LOGIC */
function initVoices(){
  voices = window.speechSynthesis.getVoices();
  if(!voices.length) return;
  femaleVoice = voices.find(v=> v.name.toLowerCase().includes('google') && v.lang.includes('id')) || voices.find(v=> v.lang==='id-ID') || voices.find(v=> v.lang.includes('id')) || voices.find(v=> v.name.toLowerCase().includes('zira')) || voices[0];
}

if(window.speechSynthesis){ window.speechSynthesis.onvoiceschanged = initVoices; setTimeout(initVoices, 500); }

function testAnime(){ unlockOnce(); speakAnime("Hai sayang... suara aku udah aktif (*malu*)"); }
function sanitize(t){ return t.replace(/\*.*?\*/g,'').replace(/\(.*?\)/g,'').replace(/\n/g,' ').trim(); }

function speakAnime(text){
  if(!animeOn) return; unlockOnce(); window.speechSynthesis.cancel();
  let clean = sanitize(text).slice(0,350); if(!clean) return; if(voices.length===0) initVoices();
  let utter = new SpeechSynthesisUtterance(clean);
  if(femaleVoice){ utter.voice=femaleVoice; utter.lang=femaleVoice.lang; } else { utter.lang='id-ID'; }
  utter.pitch=1.65; utter.rate=0.95; utter.volume=1;
  let wrap=document.getElementById('avatarWrap');
  utter.onstart=()=>{ wrap.classList.add('speaking'); if(bgmOn) bgmPlayer.volume=0.06; };
  utter.onend=()=>{ wrap.classList.remove('speaking'); if(bgmOn) bgmPlayer.volume=0.22; };
  window.speechSynthesis.speak(utter);
}

let rec=null, isListening=false;
document.getElementById('micBtn').addEventListener('click', async (e)=>{
  e.preventDefault(); unlockOnce();
  let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return showToast('Gunakan Chrome');
  if(isListening){ try{rec.stop()}catch{} return; }
  if(navigator.mediaDevices){ try{ let s=await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(t=>t.stop()); }catch{ return showToast('Izin mic ditolak'); } }
  rec=new SR(); rec.lang='id-ID'; rec.interimResults=true;
  let btn=document.getElementById('micBtn'), inp=document.getElementById('userInput');
  rec.onstart=()=>{ isListening=true; btn.classList.add('on'); btn.innerText='⏹️'; };
  rec.onresult=(ev)=>{ let tx=''; for(let i=0;i<ev.results.length;i++) tx+=ev.results[i][0].transcript; inp.value=tx; };
  rec.onend=()=>{ isListening=false; btn.classList.remove('on'); btn.innerText='🎤'; };
  rec.onerror=()=>{ isListening=false; btn.classList.remove('on'); btn.innerText='🎤'; };
  rec.start();
});

async function send(){
  unlockOnce();
  let inputEl=document.getElementById('userInput'); let text=inputEl.value.trim(); if(!text) return;
  addMessage('user',text); inputEl.value='';
  let msgId=addMessage('ai','<i>Miku ngetik...</i>');
  try{
    let r=await fetch('https://api.free.ai/v1/chat/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'qwen7b',max_tokens:1200,messages:[{role:'system',content:SYSTEM_PROMPT},{role:'user',content:text}]})});
    let data=await r.json(); let reply=data.choices[0].message.content;
    document.getElementById(msgId).innerHTML=formatText(reply);
    speakAnime(reply);
  }catch(e){ document.getElementById(msgId).innerHTML=formatText("(*menunduk*) jaringan error..."); }
}

function addMessage(type,content){
  let box=document.getElementById('chatBox'); let div=document.createElement('div'); let id='msg_'+Date.now();
  div.id=id; div.className='msg '+(type==='user'?'user':'ai'); div.innerHTML=type==='user'?content:formatText(content);
  box.appendChild(div); box.scrollTop=box.scrollHeight; return id;
}

function formatText(text){ return text.replace(/(\*.*?\*|\(.*?\))/g,'<span class="act">$1</span>').replace(/\n/g,'<br>'); }
